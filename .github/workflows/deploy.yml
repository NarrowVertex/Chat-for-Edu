name: Deploy to AWS Lightsail (IAM Role)

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  run_job_with_aws:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: 2. Get Lightsail Instance IP
        run: |
          INSTANCE_IP=$(aws lightsail get-instance --instance-name "${{ secrets.LIGHTSAIL_INSTANCE_NAME }}" --query "instance.publicIpAddress" --output text)
          echo "INSTANCE_IP=$INSTANCE_IP" >> $GITHUB_ENV

      - name: 3. Download Lightsail Key Pair
        run: |
          # 1. CLI의 JSON 응답에서 privateKeyBase64 텍스트만 추출합니다.
          PRIVATE_KEY_BASE64=$(aws lightsail download-default-key-pair --query "privateKeyBase64" --output text)
          
          # 2. 추출한 Base64 텍스트를 디코딩하여 실제 .pem 파일로 변환합니다.
          echo "$PRIVATE_KEY_BASE64" | base64 --decode > ./lightsail.pem
          
          # 3. SSH 키의 필수 보안 권한을 설정합니다.
          chmod 400 ./lightsail.pem

      - name: 4. Execute Remote Commands via SSH
        run: |
          ssh -i ./lightsail.pem -o StrictHostKeyChecking=no ubuntu@${{ env.INSTANCE_IP }} "ls"
