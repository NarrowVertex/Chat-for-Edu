name: Deploy to AWS Lightsail (IAM Role)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  run_job_with_aws:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 1. 외부(GA)에서 프론트엔드 빌드 수행
      - name: 3. Install dependencies and build frontend
        run: |
          cd frontend
          npm i
          npm i -D terser
          npm run build
      
      - name: 4. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          
      - name: 5. Get Lightsail Instance IP
        run: |
          INSTANCE_IP=$(aws lightsail get-instance --instance-name "${{ secrets.LIGHTSAIL_INSTANCE_NAME }}" --query "instance.publicIpAddress" --output text)
          echo "INSTANCE_IP=$INSTANCE_IP" >> $GITHUB_ENV

      - name: 6. Download Lightsail Key Pair
        run: |
          # 1. AWS로부터 비밀키 텍스트를 가져옵니다.
          RAW_KEY=$(aws lightsail download-default-key-pair --query "privateKeyBase64" --output text)
          
          # 2. 앞의 BEGIN 문구와 그 뒤에 붙은 공백(스페이스)까지 통째로 날려버립니다.
          # sed 's/대상/바꿀말/g' 구문을 씁니다.
          PURE_KEY=$(echo "$RAW_KEY" | sed 's/-----BEGIN RSA PRIVATE KEY----- //g' | fold -w 64)
          
          # 3. 깨끗해진 본문 위아래로 정석 규격 문구를 붙여서 .pem 파일을 완성합니다.
          # echo "-----BEGIN RSA PRIVATE KEY-----" > ./lightsail.pem
          echo "$PURE_KEY" >> ./lightsail.pem
          # echo "-----END RSA PRIVATE KEY-----" >> ./lightsail.pem

          # 4. SSH 키 출력
          # cat ./lightsail.pem
          
          # 4. [강력 조치] 소유자 외에는 읽기/쓰기/실행을 아예 못하도록 강력하게 400 권한을 다시 먹입니다.
          chmod 400 ./lightsail.pem
          
          # (선택 사항) 권한이 제대로 바뀌었는지 로그로 확인하기 위한 안전장치
          # ls -l ./lightsail.pem

      # 4. 빌드된 프론트엔드 파일 전송 (SCP)
      - name: 7. Transfer frontend build files to Lightsail
        run: |
          scp -i ./lightsail.pem -o StrictHostKeyChecking=no -r frontend/dist/* ubuntu@${{ env.INSTANCE_IP }}:~/Chat-for-Edu/frontend/dist/

      - name: 8. Execute Remote Commands via SSH
        run: |
          ssh -i ./lightsail.pem -T -q -o StrictHostKeyChecking=no ubuntu@${{ env.INSTANCE_IP }} << 'EOF'
            cd ~/Chat-for-Edu
            git fetch origin main
            git checkout main
            git pull origin main

            cd backend
            npm ci --only=production
            
            # 프로세스 및 웹서버 재시작
            pm2 restart backend-process
            sudo systemctl restart nginx
          EOF

      # 6. 사용한 임시 키 및 메타데이터 삭제 (보안 정리)
      - name: 9. Clean up temporary credentials
        if: always() 
        run: |
          rm -f ./lightsail.pem
