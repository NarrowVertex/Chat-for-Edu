name: Deploy to AWS Lightsail (IAM Native)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 1. 외부(GA)에서 프론트엔드 빌드 수행
      - name: Install dependencies and build frontend
        run: |
          cd frontend
          npm i
          npm i -D terser
          npm run build

      # 2. AWS IAM 자격 증명 설정
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. AWS API로 임시 접속 자격 증명 가져오기 (환경 변수 적용)
      - name: Get Lightsail Access Details
        id: lightsail_auth
        # GitHub Secrets에 등록했다면 secrets.XXX, Variables에 등록했다면 vars.XXX 사용
        env:
          INSTANCE_NAME: ${{ secrets.LIGHTSAIL_INSTANCE_NAME }} 
        run: |
          # AWS API를 통해 임시 접속 세션 정보를 가져옵니다.
          aws lightsail get-instance-access-details --instance-name "$INSTANCE_NAME" > access_details.json
          
          # 임시 SSH 프라이빗 키 파일 생성 및 권한 변경
          jq -r '.accessDetails.privateKeyHex' access_details.json | xxd -r -p > lightsail_key.pem
          chmod 600 lightsail_key.pem
          
          # IP와 유저네임을 다음 스텝에서 쓸 수 있도록 환경 변수로 내보내기
          echo "IP=$(jq -r '.accessDetails.ipAddress' access_details.json)" >> $GITHUB_ENV
          echo "USERNAME=$(jq -r '.accessDetails.username' access_details.json)" >> $GITHUB_ENV

      # 4. 빌드된 프론트엔드 파일 전송 (SCP)
      - name: Transfer frontend build files to Lightsail
        run: |
          # 안전한 전송을 위해 서버 측에 dist 디렉토리가 없다면 미리 생성하는 명령어를 scp 전에 실행해두면 더 안전합니다.
          # 여기서는 기존 구조대로 바로 전송합니다.
          scp -i lightsail_key.pem -o StrictHostKeyChecking=no -r frontend/dist/* ${USERNAME}@${IP}:~/Chat-for-Edu/frontend/dist/

      # 5. 서버 백엔드 후처리 및 서비스 재시작 (SSH)
      - name: Execute remote ssh commands to deploy
        run: |
          ssh -i lightsail_key.pem -o StrictHostKeyChecking=no ${USERNAME}@${IP} << 'EOF'
            cd ~/Chat-for-Edu
            git fetch origin main
            git checkout main
            git pull origin main
            
            cd backend
            npm ci --only=production
            
            # 프로세스 및 웹서버 재시작
            pm2 restart backend-process
            sudo systemctl restart nginx
            
            echo "IAM-based Deployment completed perfectly!"
          EOF

      # 6. 사용한 임시 키 및 메타데이터 삭제 (보안 정리)
      - name: Clean up temporary credentials
        if: always() 
        run: |
          rm -f lightsail_key.pem access_details.json
